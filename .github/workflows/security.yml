name: Security scans

on:
  push:
    branches: ["**"]
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Pulls from Docker Hub without a login share a rate limit with every other user of the runner's IP address.
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: make install-test

      - name: Bandit
        run: make bandit

      - name: Trivy on the repo files
        run: make trivy-fs

      - name: Build the production image
        run: docker compose build prod

      - name: Trivy on the production image
        run: make trivy-image

      - name: Dockle
        run: make dockle
