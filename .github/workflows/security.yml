name: Security scans

on:
  push:
    tags-ignore:
      - '**'
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Run Bandit
        run: make bandit

      - name: Build the production image
        run: make build-prod-image

      - name: Run Trivy against the production image
        run: make trivy-image

      - name: Run Trivy against the repository
        run: make trivy-fs

      - name: Run Dockle
        run: make dockle
