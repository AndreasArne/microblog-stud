name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  security:
    uses: ./.github/workflows/security.yml

  publish:
    needs: [test, security]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create image tags from the git tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/microblog
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/deploy.txt

      - name: Install Ansible
        run: pip install -r requirements/deploy.txt

      - name: Save the ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy the new version, one server at a time, and check it
        working-directory: ansible
        run: >
          ansible-playbook deploy_app.yml check_version.yml
          -e app_hosts=prod_app
          -e app_version=${{ needs.publish.outputs.version }}
          -e db_password="$DB_PASSWORD"
          -e app_secret_key="$APP_SECRET_KEY"
          --private-key ~/.ssh/id_ed25519
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
