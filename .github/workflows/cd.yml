name: CD
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Derive image version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile_prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/microblog:${{ env.VERSION }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/deploy.txt
      - run: pip install -r requirements/deploy.txt
      - name: Save deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Roll out the published version
        working-directory: ansible
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.MICROBLOG_SECRET_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ansible-playbook -i hosts_deploy rolling_deploy.yml \
            --private-key ~/.ssh/id_ed25519 \
            -e "app_version=$VERSION" \
            -e "db_password=$DB_PASSWORD" \
            -e "secret_key=$SECRET_KEY"
