name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  publish:
    needs:
      - test
      - security
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile_prod
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/microblog:${{ steps.version.outputs.value }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.publish.outputs.app_version }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/deploy.txt

      - name: Install deploy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/deploy.txt
          ansible-galaxy collection install -r ansible/requirements.yml --force

      - name: Save the ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build deploy inventory
        working-directory: ansible
        run: |
          domain_name=$(python -c "import yaml; print(yaml.safe_load(open('group_vars/all.yml', 'r', encoding='utf-8'))['domain_name'])")
          printf '[appserver]\nappserver1.%s\nappserver2.%s\n\n[loadbalancer]\nloadbalancer.%s\n\n[database]\nloadbalancer.%s\n' \
            "$domain_name" "$domain_name" "$domain_name" "$domain_name" > hosts.deploy

      - name: Run the deploy playbook
        working-directory: ansible
        run: ansible-playbook -i hosts.deploy deploy_production.yml --private-key ~/.ssh/id_ed25519
