# Adds the monitoring stack to the project's docker-compose.yml. Start with:
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.yml up -d prod prometheus alertmanager grafana
# Paths are relative to the first file, docker-compose.yml in the root of the repo.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - prod

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:13.2.3
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-data:
