apiVersion: apps/v1
kind: Deployment
metadata:
  name: microblog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microblog
  template:
    metadata:
      labels:
        app: microblog
    spec:
      containers:
      - name: microblog
        image: andreasarne/microblog:11.0.1
        ports:
        - containerPort: 5000
        env:
        - name: SECRET_KEY
          value: my-secret-key
        - name: DATABASE_URL
          value: mysql+pymysql://microblog:microblogpw@mysql/microblog
        resources:
          requests:
            cpu: 50m
          limits:
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /
            port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: microblog
spec:
  selector:
    app: microblog
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microblog
  annotations:
    cert-manager.io/issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - k8s.devops.arnesson.dev
    secretName: demo-tls
  rules:
  - host: k8s.devops.arnesson.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: microblog
            port:
              number: 80
