apiVersion: v1
kind: Service
metadata:
  name: microblog
  namespace: andreas
spec:
  selector:
    app: microblog
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microblog
  namespace: andreas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microblog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: microblog
    spec:
      containers:
        - name: microblog
          image: docker.io/andreasarne/microblog:11.0.4
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: DATABASE_URL
              value: mysql+pymysql://microblog:microblog-db-password@mysql.andreas.svc.cluster.local/microblog
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: microblog-secrets
                  key: SECRET_KEY
            - name: APP_VERSION
              value: 11.0.4
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /version
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microblog
  namespace: andreas
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - devops.arnesson.dev
        - www.devops.arnesson.dev
      secretName: microblog-tls
  rules:
    - host: devops.arnesson.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microblog
                port:
                  number: 5000
    - host: www.devops.arnesson.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microblog
                port:
                  number: 5000
