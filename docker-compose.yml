services:
  mysql:
    image: mysql/mysql-server:8.0
    environment:
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: microblog
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u microblog -pmicroblog
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-11.0.0-local}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SECRET_KEY: devops-secret-key
      DATABASE_URL: mysql+pymysql://microblog:microblog@mysql/microblog
    ports:
      - "8000:5000"

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    environment:
      FLASK_APP: microblog.py
    volumes:
      - ./app:/home/microblog/app
      - ./tests:/home/microblog/tests

volumes:
  mysql_data:
