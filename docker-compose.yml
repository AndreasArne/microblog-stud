services:
  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: microblog:prod
    ports:
      - "8000:5000"
    environment:
      SECRET_KEY: my-secret-key
      DATABASE_URL: mysql+pymysql://microblog:secretpw@db/microblog
    depends_on:
      - db

  db:
    image: mysql/mysql-server:5.7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: secretpw
    volumes:
      - db-data:/var/lib/mysql

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    image: microblog:test
    volumes:
      - ./app:/home/microblog/app
      - ./tests:/home/microblog/tests

volumes:
  db-data:
