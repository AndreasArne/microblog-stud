services:
  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: microblog:prod
    ports:
      - "8000:5000"
    environment:
      SECRET_KEY: my-secret-key
      DATABASE_URL: mysql+pymysql://microblog:secretpw@db/microblog
    depends_on:
      - db

  db:
    image: mysql/mysql-server:5.7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: secretpw
    volumes:
      - db-data:/var/lib/mysql

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    image: microblog:test
    volumes:
      - ./app:/home/microblog/app
      - ./tests:/home/microblog/tests

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - prod

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
  grafana-data:
