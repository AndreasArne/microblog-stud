---
-   name: Remove default conf
    file:
        state: absent
        path: /etc/nginx/sites-enabled/default

-   name: Copy nginx.conf to the server
    copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
        mode: "644"
    register: nginx_main_config

-   name: Template the nginx site config to the server
    template:
        src: load-balancer.conf.j2
        dest: /etc/nginx/sites-available/load-balancer.conf
        mode: "644"
    register: nginx_site_config

-   name: Link the site config into sites-enabled
    file:
        state: link
        force: yes
        src: /etc/nginx/sites-available/load-balancer.conf
        path: /etc/nginx/sites-enabled/load-balancer.conf
    register: nginx_site_link

-   name: Validate the Nginx configuration
    command: nginx -t
    changed_when: false

-   name: Reload Nginx when the config changed
    service:
        name: nginx
        state: reloaded
    when: nginx_main_config.changed or nginx_site_config.changed or nginx_site_link.changed
