---
-   name: Install packages
    apt:
        name: "{{ packages }}"
        state: present

-   name: Check if certificate already exists
    stat:
        path: /etc/letsencrypt/live/{{ domain_name }}/cert.pem
    register: letsencrypt_cert

-   name: Check who issued the certificate
    command: openssl x509 -in /etc/letsencrypt/live/{{ domain_name }}/cert.pem -noout -issuer
    register: cert_issuer
    changed_when: false
    check_mode: false
    when: letsencrypt_cert.stat.exists

-   name: Decide if we need a new certificate
    set_fact:
        need_cert: "{{ not letsencrypt_cert.stat.exists or (not certbot_staging | bool and '(STAGING)' in cert_issuer.stdout) }}"

-   name: Show whether a new certificate is needed
    debug:
        msg: "exists {{ letsencrypt_cert.stat.exists }}, certbot_staging {{ certbot_staging }}, new certificate {{ need_cert }}"

-   name: Stop services to allow certbot to generate a cert
    service:
        name: nginx
        state: stopped
    when: need_cert

-   name: Remove the staging certificate that is replaced
    command: "certbot delete --noninteractive --cert-name {{ domain_name }}"
    when: need_cert and letsencrypt_cert.stat.exists

-   name: Generate new certificate
    command: "certbot certonly --standalone --noninteractive --expand --agree-tos --email {{ admin_email }} -d {{ domain_name }} -d www.{{ domain_name }} {{ '--staging' if certbot_staging | bool else '' }}"
    when: need_cert

-   name: Configure Nginx
    include_tasks: nginx.yml

-   name: Ensure Nginx is started
    service:
        name: nginx
        state: started
