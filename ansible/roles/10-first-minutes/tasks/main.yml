---
-   name: Update apt-cache and upgrade
    apt:
        force_apt_get: yes
        update_cache: "True"
        cache_valid_time: 3600
        upgrade: yes

-   name: Install packages
    apt:
        force_apt_get: yes
        name: "{{ packages }}"

-   name: Create a swap file
    command: fallocate -l 1G /swapfile
    args:
        creates: /swapfile

-   name: Set the permissions of the swap file
    file:
        path: /swapfile
        owner: root
        group: root
        mode: "600"

-   name: Format and enable the swap file
    shell: mkswap /swapfile && swapon /swapfile
    when: ansible_swaptotal_mb == 0

-   name: Enable the swap file at boot
    lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        regexp: '^/swapfile '
        state: present

-   name: Copy unattended upgrades 10 settings
    copy:
        mode: "644"
        src: files/apt_periodic
        dest: /etc/apt/apt.conf.d/10periodic

-   name: Copy unattended upgrades 50 settings
    copy:
        mode: "644"
        src: files/apt_periodic_50
        dest: /etc/apt/apt.conf.d/50unattended-upgrades

-   name: Create user
    user:
        name: "{{ server_user }}"
        state: present
        shell: /bin/bash
        groups: "{{ server_user_groups }}"

-   name: Add SSH keys for the deploy user
    authorized_key:
        user: "{{ server_user }}"
        state: present
        key: "{{ lookup('file', item) }}"
    loop: "{{ lookup('fileglob', pub_ssh_key_directory ~ '/*.pub', wantlist=True) }}"

-   name: Add user to sudoers
    lineinfile:
        dest: /etc/sudoers
        regexp: "{{ server_user }} ALL"
        line: "{{ server_user }} ALL=(ALL) NOPASSWD:ALL"
        state: present
        validate: '/usr/sbin/visudo -cf %s'

-   name: Install the hardened SSH server config
    template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        mode: "0600"
        validate: '/usr/sbin/sshd -t -f %s'
    notify: restart ssh

-   name: Disallow root and password ssh access
    lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: '/usr/sbin/sshd -T -f %s'
    loop:
        -   regexp: "^PasswordAuthentication"
            line: "PasswordAuthentication no"
        -   regexp: "^PermitRootLogin"
            line: "PermitRootLogin no"
    notify: restart ssh

-   name: Flush handlers to restart SSH
    meta: flush_handlers

-   name: Only allow the deploy user to ssh
    lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^AllowUsers"
        line: "AllowUsers {{ server_user }}"
        state: present

-   name: Remove default user
    remote_user: "{{ server_user }}"
    user:
        name: azureuser
        state: absent
        force: yes
        remove: yes
