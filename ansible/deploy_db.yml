---
# The database should be on its own VM, but to save costs it runs on the load balancer VM.
-   hosts: database
    remote_user: "{{ server_user }}"
    become: yes
    become_method: sudo
    roles:
        -   setup_docker
    tasks:
        -   name: Start the MySQL container
            community.docker.docker_container:
                name: mysql
                image: "mysql:5.7"
                state: started
                restart_policy: unless-stopped
                ports:
                    - "3306:3306"
                volumes:
                    - mysql-data:/var/lib/mysql
                env:
                    MYSQL_ROOT_PASSWORD: "{{ db_root_password }}"
                    MYSQL_DATABASE: "{{ db_name }}"
                    MYSQL_USER: "{{ db_user }}"
                    MYSQL_PASSWORD: "{{ db_password }}"
