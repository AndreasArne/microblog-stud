# Gather Azure facts from remote instance
---
-   hosts: local
    connection: local
    gather_facts: False
    collections:
        - azure.azcollection
    roles:
        -   role: gather_instances
            group_prefix: old_



-   name: remove instance
    hosts: old_devops
    connection: local
    gather_facts: False
    collections:
        - azure.azcollection
    roles:
        - terminate_instances



-   name: remove networks
    hosts: local
    gather_facts: False
    tasks:
        -   include_tasks: roles/terminate_instances/tasks/vnet.yml
    collections:
        - azure.azcollection



-   name: remove security groups
    hosts: local
    gather_facts: False
    vars:
        state: absent
    roles: 
        - security_groups